<!-- ============================================================
  EXAMPLE 1: SIMPLE INTEGRATION (Minimal)
  ============================================================ -->

<!-- Add to HEAD: -->
<head>
  <!-- ... other head content ... -->
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Telegram Auth Module -->
  <script src="js/auth.js"></script>
</head>

<!-- Add before closing BODY: -->
<body>
  <!-- ... your page content ... -->
  
  <script>
    // Initialize auth
    (async () => {
      TelegramAuth.setConfig({
        supabaseUrl: 'https://your-project.supabase.co',
        supabaseAnonKey: 'your-anon-key-here',
      });

      await TelegramAuth.init();

      if (!TelegramAuth.isAuthorized()) {
        alert('Please login via Telegram first');
        location.href = 'index.html';
        return;
      }

      const profile = TelegramAuth.getProfile();
      console.log('Logged in as:', profile.nickname);
    })();
  </script>
</body>

<!-- ============================================================
  EXAMPLE 5: LISTEN TO AUTH EVENT (Advanced)
  ============================================================ -->

<script>
  // This runs on ANY page that has auth.js loaded
  
  document.addEventListener('telegramAuthReady', (event) => {
    const { user, profile } = event.detail;
    
    console.log('Auth ready event fired!');
    console.log('User:', user.username);
    console.log('Profile UID:', profile.profile.uid);
    console.log('Balance:', profile.balance.cash);
    
    // Update entire UI with real data
    updateUIWithRealData(profile);
  });

  function updateUIWithRealData(profile) {
    // Update all user-related elements
    const elements = document.querySelectorAll('[data-user-field]');
    
    elements.forEach((el) => {
      const field = el.getAttribute('data-user-field');
      
      if (field === 'nickname') el.textContent = profile.profile.nickname;
      if (field === 'level') el.textContent = profile.profile.level;
      if (field === 'cash') el.textContent = profile.balance.cash;
      if (field === 'bank') el.textContent = profile.balance.bank;
      if (field === 'vip') el.textContent = profile.vip.vip_level;
      if (field === 'avatar') el.src = profile.profile.avatar_url;
    });
  }
</script>

<!-- ============================================================
  EXAMPLE 6: ERROR HANDLING
  ============================================================ -->

<script>
  (async () => {
    TelegramAuth.setConfig({
      supabaseUrl: 'https://your-project.supabase.co',
      supabaseAnonKey: 'your-anon-key-here',
    });

    const result = await TelegramAuth.init();

    // Handle different error cases
    if (result.error === 'BANNED') {
      alert('Your account has been banned');
      location.href = 'index.html';
      return;
    }

    if (result.error === 'DELETED') {
      alert('Your account has been deleted');
      location.href = 'index.html';
      return;
    }

    if (result.error) {
      alert('Error: ' + result.error);
      console.error('Auth error:', result.error);
      return;
    }

    if (!TelegramAuth.isAuthorized()) {
      alert('Please login via Telegram');
      location.href = 'index.html';
      return;
    }

    // All good!
    const profile = TelegramAuth.getProfile();
    console.log('User authorized:', profile.nickname);
  })();
</script>


<!-- ============================================================
  EXAMPLE 7: OFFLINE FALLBACK (Using localStorage cache)
  ============================================================ -->

<script>
  (async () => {
    TelegramAuth.setConfig({
      supabaseUrl: 'https://your-project.supabase.co',
      supabaseAnonKey: 'your-anon-key-here',
    });

    await TelegramAuth.init();

    if (TelegramAuth.isAuthorized()) {
      // Online - use real data
      const profile = TelegramAuth.getProfile();
      displayUserData(profile);
    } else {
      // Offline - try localStorage cache
      const cached = TelegramAuth.getStoredUser();
      
      if (cached) {
        console.log('Using cached data (offline)');
        displayCachedUserData(cached);
      } else {
        console.log('No cached data available');
        showLoginPrompt();
      }
    }
  })();

  function displayUserData(profile) {
    console.log('Displaying REAL data:', profile.nickname);
  }

  function displayCachedUserData(cached) {
    console.log('Displaying CACHED data:', cached.nickname);
  }

  function showLoginPrompt() {
    alert('Please login via Telegram to continue');
    location.href = 'index.html';
  }
</script>


<!-- ============================================================
  EXAMPLE 8: CONDITIONAL UI RENDERING
  ============================================================ -->

<script>
  (async () => {
    TelegramAuth.setConfig({
      supabaseUrl: 'https://your-project.supabase.co',
      supabaseAnonKey: 'your-anon-key-here',
    });

    await TelegramAuth.init();

    const authorized = TelegramAuth.isAuthorized();
    const banned = TelegramAuth.isBanned();
    const deleted = TelegramAuth.isDeleted();

    // Show/hide UI based on auth status
    document.getElementById('loginRequired').style.display = 
      authorized ? 'none' : 'block';

    document.getElementById('mainContent').style.display = 
      authorized && !banned && !deleted ? 'block' : 'none';

    if (banned) {
      document.getElementById('bannedMessage').style.display = 'block';
    }

    if (deleted) {
      document.getElementById('deletedMessage').style.display = 'block';
    }
  })();
</script>

<!-- HTML: -->
<div id="loginRequired">Please login via Telegram</div>
<div id="mainContent">Main content here</div>
<div id="bannedMessage" style="display: none;">Account banned</div>
<div id="deletedMessage" style="display: none;">Account deleted</div>
